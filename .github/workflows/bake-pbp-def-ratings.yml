name: Bake on-court (PBP) defensive ratings (R)

# One-shot/backfill bake of actual on-court defensive ratings (points
# allowed per 100 possessions while on the floor, from api.pbpstats.com's
# play-by-play totals) into app/data/def-ratings.json as
# the rsPbp/poPbp/teamPbp/teamPoPbp keys the app prefers over the
# basketball-reference box-score estimates for 2000-01+. Runs on whatever
# ref it is dispatched from and commits the JSON back to that branch.
# Day-to-day freshness of the current season is handled by the daily
# backfill workflow.
on:
  # Push trigger: scoped to the feature branch + pipeline files so the full
  # bake starts on push without needing a manual dispatch (the automation
  # token can't dispatch workflows). Re-runs are cheap no-ops once the data
  # is present, and the bot's own data commit is [skip ci].
  push:
    branches: ["claude/playoff-tracker-shooting-splits-u3tqxl"]
    paths:
      - "scripts/R/fetch_pbp_def_ratings.R"
      - ".github/workflows/bake-pbp-def-ratings.yml"
  workflow_dispatch:
    inputs:
      start_season:
        description: "First season to bake (YYYY-YY; clamped to 2000-01)"
        required: false
        default: "2000-01"
      end_season:
        description: "Last season to bake (YYYY-YY)"
        required: false
        default: "2025-26"
      force:
        description: "Refetch seasons already present"
        required: false
        default: "false"

concurrency:
  group: bake-pbp-def-ratings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # A clean pass is minutes; the ceiling is sized for the bad case, where
    # every outstanding side burns its full 20/45/90s backoff against a
    # pbpstats answering with degraded responses. The real ceiling sits on
    # the fetch step below rather than here, so that an overrun ends that
    # step instead of the job and the commit still happens.
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        # install.packages() does not fail the step when a mirror hiccups, so
        # run #9 spent its whole dispatch getting to "there is no package
        # called httr" inside the bake. Assert instead.
        run: >
          Rscript -e 'pkgs <- c("httr", "xml2", "jsonlite");
          install.packages(pkgs);
          missing <- setdiff(pkgs, rownames(installed.packages()));
          if (length(missing)) stop("install failed: ", paste(missing, collapse=", "))'

      - name: Fetch on-court defensive ratings
        # On the step, not the job: a job-level timeout kills the commit with
        # it, throwing away every season the run had already fetched and
        # written. Ending here leaves the commit below to bank them.
        timeout-minutes: 55
        run: >
          Rscript scripts/R/fetch_pbp_def_ratings.R
          "${{ inputs.start_season || '2000-01' }}"
          "${{ inputs.end_season || '2025-26' }}"
          ${{ (inputs.force == 'true') && '--force' || '' }}

      - name: Commit baked JSON
        # always(): the bake writes each season as it lands, so even a run
        # that overran or died partway has real progress on disk worth
        # keeping — and whatever it missed is simply outstanding again next
        # run, since each side is fetched on its own need.
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bake on-court (PBP) defensive ratings (R) [skip ci]"
          file_pattern: "app/data/def-ratings.json"
          # The action's default `git fetch` prints every remote branch — a
          # hundred-odd lines that push the bake's own per-season report out
          # of the retrievable end of the log, which is exactly where the
          # diagnosis lives when seasons fail. The checkout above is already
          # at the ref being committed to.
          skip_fetch: true
