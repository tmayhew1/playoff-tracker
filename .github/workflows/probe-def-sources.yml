name: Probe defensive-rating data sources (R)

# Diagnostic only — writes no data and commits nothing. Prints which
# per-possession sources are reachable from a GitHub Actions runner and what
# shape they arrive in, so the choice of a replacement/second source for
# def-ratings.json's on-court keys rests on evidence rather than on what the
# hosts do from a laptop. See scripts/R/probe_def_sources.R.
on:
  push:
    branches: ["claude/defensive-rating-data-sources-leqpnm"]
    paths:
      - "scripts/R/probe_def_sources.R"
  workflow_dispatch:

concurrency:
  group: probe-def-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # Section B deliberately waits out a stats.nba.com hang; everything else
    # is a handful of requests plus one archive download.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr", "xml2", "jsonlite"))'

      - name: Probe sources
        run: Rscript scripts/R/probe_def_sources.R
