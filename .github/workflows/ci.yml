name: CI

# The checks a contributor runs locally, on every pull request: lint, the Value
# Added unit tests, the Legacy verification suite, and a production build. The bake workflows commit with
# [skip ci], so their daily data commits don't queue a run each.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs exactly what package-lock.json records.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Legacy verification
        run: npm run legacy:verify

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
