name: Bake NBA draft picks (R)

# Scrapes Basketball-Reference draft pages into app/data/draft-picks.json,
# which the 2026-27 Look Ahead's rookie projections read. A draft is fixed once
# it happens, so this runs on demand — or when the scraper itself changes
# (which is also how it first runs: a manual trigger needs the workflow on the
# default branch). One page per year, so a decade takes minutes. The bake is
# idempotent, so a re-run over the same drafts commits nothing.
on:
  push:
    paths:
      - "scripts/R/fetch_draft.R"
      - ".github/workflows/bake-draft.yml"
  workflow_dispatch:
    inputs:
      first:
        description: "First draft year"
        required: true
        default: "2016"
      last:
        description: "Last draft year"
        required: true
        default: "2026"

concurrency:
  group: bake-draft
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr", "xml2", "jsonlite"))'

      - name: Bake draft picks
        run: Rscript scripts/R/fetch_draft.R "${{ inputs.first || '2016' }}" "${{ inputs.last || '2026' }}"

      - name: Catch up with the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Commit baked JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bake NBA draft picks ${{ inputs.first || '2016' }}-${{ inputs.last || '2026' }} [skip ci]"
          file_pattern: "app/data/draft-picks.json"
