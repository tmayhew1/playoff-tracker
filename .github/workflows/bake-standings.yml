name: Bake NBA team records (R)

# Scrapes every season's team records (W-L, margin, ratings) from
# Basketball-Reference into app/data/team-records.json, which the 2026-27 Look
# Ahead fits its win projections on. Runs on demand, or when the scraper
# changes (a manual trigger needs the workflow on the default branch first).
# One page per season; the bake is idempotent, so a re-run commits nothing.
on:
  push:
    paths:
      - "scripts/R/fetch_standings.R"
      - ".github/workflows/bake-standings.yml"
  workflow_dispatch:
    inputs:
      first:
        description: "First season end year"
        required: true
        default: "1981"
      last:
        description: "Last season end year"
        required: true
        default: "2026"

concurrency:
  group: bake-standings
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr", "xml2", "jsonlite"))'

      - name: Bake team records
        run: Rscript scripts/R/fetch_standings.R "${{ inputs.first || '1981' }}" "${{ inputs.last || '2026' }}"

      - name: Catch up with the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Commit baked JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bake NBA team records ${{ inputs.first || '1981' }}-${{ inputs.last || '2026' }} [skip ci]"
          file_pattern: "app/data/team-records.json"
